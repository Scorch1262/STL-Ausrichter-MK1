name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10"

      - name: Version lesen
        id: ver
        shell: bash
        run: |
          V=$(python -c "from version import VERSION; print(VERSION)")
          echo "version=$V" >> $GITHUB_OUTPUT

      # EINE einzelne exe ohne daneben liegende Dateien/Ordner (--onefile)
      - name: EXE bauen (eine Datei)
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name "STL-Ausrichter-MK1-v${{ steps.ver.outputs.version }}"
          --icon assets/icon.ico
          --add-data "assets;assets"
          --hidden-import OpenGL.platform.win32
          --collect-submodules OpenGL.arrays
          --collect-all OCP
          --collect-all trimesh
          --collect-all fast_simplification
          --collect-all pyransac3d
          --collect-all scipy
          --collect-all psutil
          --collect-all pymeshfix
          --collect-all networkx
          --exclude-module tkinter
          main.py

      - name: Größe der exe anzeigen
        shell: pwsh
        run: |
          $exe = "dist/STL-Ausrichter-MK1-v${{ steps.ver.outputs.version }}.exe"
          Get-Item $exe | Select-Object Name, Length

      - name: ZIP erstellen
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path "dist/STL-Ausrichter-MK1-v$v.exe" -DestinationPath "STL-Ausrichter-MK1-v$v-windows.zip"

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: STL-Ausrichter-MK1-v${{ steps.ver.outputs.version }}-windows
          path: STL-Ausrichter-MK1-v${{ steps.ver.outputs.version }}-windows.zip

      - name: Release erstellen / aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: STL-Ausrichter-MK1 v${{ steps.ver.outputs.version }}
          files: |
            STL-Ausrichter-MK1-v${{ steps.ver.outputs.version }}-windows.zip
            dist/STL-Ausrichter-MK1-v${{ steps.ver.outputs.version }}.exe
          make_latest: true
